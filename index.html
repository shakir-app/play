<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Game Hub - ระบบจัดเก็บไฟล์เกม</title>
  
  <!-- Google Fonts: Prompt -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Prompt', 'sans-serif'] },
        },
      },
    }
  </script>

  <!-- FontAwesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- jQuery & DataTables -->
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }
    .dataTables_wrapper .dataTables_length select,
    .dataTables_wrapper .dataTables_filter input {
      border: 1px solid #e5e7eb;
      border-radius: 0.5rem;
      padding: 0.5rem 0.75rem;
      margin-bottom: 1rem;
      outline: none;
    }
    .dataTables_wrapper .dataTables_paginate .paginate_button.current {
      background: #3b82f6 !important;
      color: white !important;
      border: 1px solid #3b82f6 !important;
      border-radius: 0.5rem;
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans text-gray-900">

  <!-- ==================== VIEW 1: DASHBOARD (หน้าหลัก) ==================== -->
  <div id="dashboardView" class="hidden p-4 md:p-8 max-w-6xl mx-auto">
    <!-- Header -->
    <header class="flex items-center justify-between mb-8 pb-4 border-b border-gray-200">
      <div class="flex items-center gap-3">
        <div class="bg-blue-600 text-white p-3 rounded-xl shadow-md">
          <i class="fas fa-gamepad text-2xl"></i>
        </div>
        <h1 class="text-3xl font-bold text-gray-950">AI Game <span class="font-light text-gray-600">Hub</span></h1>
      </div>
      <p class="text-sm text-gray-500 hidden md:block">ระบบจัดเก็บและเล่นเกมส์ออนไลน์ที่สร้างโดย AI</p>
    </header>

    <!-- Upload Card -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 mb-8 transition hover:shadow-md">
      <div class="flex items-center gap-3 mb-5">
        <i class="fas fa-cloud-upload-alt text-xl text-blue-500"></i>
        <h2 class="text-xl font-semibold text-gray-800">อัปโหลดไฟล์เกมใหม่</h2>
      </div>
      
      <div class="flex flex-col md:flex-row items-center justify-between gap-4 p-5 border-2 border-dashed border-gray-200 rounded-xl bg-gray-50">
        <div class="relative w-full">
          <i class="fas fa-file-code absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
          <input type="file" id="fileInput" accept=".html" class="block w-full text-sm text-gray-500 pl-11 file:mr-4 file:py-2.5 file:px-5 file:rounded-full file:border-0 file:text-sm file:font-medium file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer border border-gray-200 rounded-full bg-white"/>
        </div>
        <button onclick="uploadFile()" id="uploadBtn" class="w-full md:w-auto bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-full font-semibold whitespace-nowrap transition duration-200 shadow-sm flex items-center justify-center gap-2 disabled:opacity-50">
          <i class="fas fa-upload"></i>
          <span>อัปโหลด (.html)</span>
        </button>
      </div>
      <p class="text-xs text-gray-400 mt-3 pl-1"><i class="fas fa-info-circle mr-1"></i> รองรับเฉพาะไฟล์นามสกุล .html ที่สร้างจาก AI เท่านั้น</p>
    </div>

    <!-- Data Table Card -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
      <div class="flex items-center gap-3 mb-5">
        <i class="fas fa-list-ul text-xl text-gray-500"></i>
        <h2 class="text-xl font-semibold text-gray-800">คลังเกมส์ทั้งหมด</h2>
      </div>

      <div class="overflow-x-auto">
        <table id="gamesTable" class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-gray-50 text-gray-700">
              <th class="py-4 px-5 font-semibold">ชื่อไฟล์เกม (คลิกเพื่อเล่นในแท็บใหม่)</th>
              <th class="py-4 px-5 font-semibold w-48">วันที่อัปโหลด</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="divide-y divide-gray-100"></tbody>
        </table>
      </div>
    </div>
  </div>


  <!-- ==================== VIEW 2: GAME PLAYER (หน้ารันเกมเต็มจอ 100% ไร้ขอบ) ==================== -->
  <div id="playerView" class="hidden fixed inset-0 z-50 bg-gray-900 w-screen h-screen overflow-hidden">
    <!-- Loading Screen -->
    <div id="gameLoading" class="absolute inset-0 flex flex-col items-center justify-center bg-gray-900 text-white z-10">
      <i class="fas fa-gamepad text-5xl text-blue-500 animate-bounce mb-4"></i>
      <p class="text-lg font-medium">กำลังโหลดไฟล์เกม...</p>
      <p class="text-xs text-gray-400 mt-1">ดึงข้อมูลจากระบบคลังเกม</p>
    </div>
    
    <!-- Fullscreen Game Frame -->
    <iframe id="gameFrame" class="w-full h-full border-0 block"></iframe>
  </div>


  <script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycby-TViIdx2ojOn6oDPISW1X00bGqfb0KtoKyJRzAYz_KusleirahN8SAWlOw75HUNC05w/exec";
    let tableInstance = null;

    const Toast = Swal.mixin({
      toast: true, position: 'top-end', showConfirmButton: false, timer: 3000, timerProgressBar: true
    });

    $(document).ready(function() {
      // ตรวจสอบ Parameter จาก URL
      const urlParams = new URLSearchParams(window.location.search);
      const gameId = urlParams.get('gameId');

      if (gameId) {
        // มี gameId -> แสดงหน้ารันเกมเต็มจอทันที
        $('body').css('overflow', 'hidden');
        $('#playerView').removeClass('hidden');
        loadGamePlayer(gameId);
      } else {
        // ไม่มี gameId -> แสดงหน้า Dashboard หลัก
        $('#dashboardView').removeClass('hidden');
        loadGameList(true);
      }
    });

    // --- โหลดและเล่นเกมแบบไร้ขอบ ---
    async function loadGamePlayer(gameId) {
      try {
        const response = await fetch(`${GAS_WEB_APP_URL}?action=getGameContent&gameId=${gameId}`);
        const result = await response.json();

        if (result.success) {
          // ตั้งชื่อแท็บตามชื่อเกม
          document.title = result.name;
          
          const iframe = document.getElementById('gameFrame');
          iframe.srcdoc = result.content;

          // ซ่อนหน้าจอ Loading เมื่อเกมโหลดเสร็จ
          $('#gameLoading').addClass('hidden');
        } else {
          Swal.fire({
            icon: 'error',
            title: 'เปิดเกมไม่สำเร็จ',
            text: result.error || 'ไม่สามารถโหลดไฟล์เกมได้',
            confirmButtonText: 'ปิดหน้าต่างนี้'
          }).then(() => { window.close(); });
        }
      } catch (err) {
        Swal.fire({
          icon: 'error',
          title: 'เกิดข้อผิดพลาดในการเชื่อมต่อ',
          text: err.message,
          confirmButtonText: 'ปิดหน้าต่างนี้'
        }).then(() => { window.close(); });
      }
    }

    // --- โหลดคลังเกมส์ (Dashboard) ---
    async function loadGameList(showLoadingModal = false) {
      let loadingAlert;
      if (showLoadingModal) {
        loadingAlert = Swal.fire({
          title: 'กำลังโหลดคลังเกมส์...', allowOutsideClick: false,
          didOpen: () => { Swal.showLoading() }
        });
      }
      
      try {
        const response = await fetch(`${GAS_WEB_APP_URL}?action=getList`);
        const result = await response.json();

        if (showLoadingModal) loadingAlert.close();

        if (result.success) {
          if (tableInstance) tableInstance.destroy();

          const tbody = $('#tableBody');
          tbody.empty();

          result.data.forEach(file => {
            const playUrl = `?gameId=${file.id}`;

            tbody.append(`
              <tr class="hover:bg-blue-50/50 transition-colors">
                <td class="py-4 px-5">
                  <a href="${playUrl}" target="_blank" class="text-blue-600 font-medium hover:text-blue-800 flex items-center gap-3 group">
                    <i class="fas fa-play-circle text-lg text-blue-400 group-hover:text-blue-600 transition"></i>
                    <span class="group-hover:underline">${file.name}</span>
                    <i class="fas fa-external-link-alt text-xs text-gray-300 group-hover:text-blue-400 ml-1"></i>
                  </a>
                </td>
                <td class="py-4 px-5 text-gray-500 text-sm">${file.date}</td>
              </tr>
            `);
          });

          tableInstance = $('#gamesTable').DataTable({
            language: {
              search: `<i class="fas fa-search text-gray-400 mr-1"></i> ค้นหาเกม:`,
              lengthMenu: "แสดง _MENU_ รายการ",
              info: "แสดง _START_ ถึง _END_ จากทั้งหมด _TOTAL_ รายการ",
              emptyTable: "ยังไม่มีไฟล์เกมในระบบ"
            },
            order: [[1, 'desc']]
          });

        } else {
          Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: result.error });
        }
      } catch (err) {
        if (showLoadingModal) loadingAlert.close();
        Swal.fire({ icon: 'error', title: 'เชื่อมต่อล้มเหลว', text: err.message });
      }
    }

    // --- ฟังก์ชันอัปโหลดไฟล์ ---
    function uploadFile() {
      const fileInput = document.getElementById('fileInput');
      const file = fileInput.files[0];

      if (!file || !file.name.endsWith('.html')) {
        Toast.fire({ icon: 'warning', title: 'กรุณาเลือกไฟล์ .html ก่อนครับ' });
        return;
      }

      const btn = document.getElementById('uploadBtn');
      btn.disabled = true;
      btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> <span>กำลังอัปโหลด...</span>`;

      Swal.fire({ title: 'กำลังอัปโหลดไฟล์...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

      const reader = new FileReader();
      reader.onload = async function(e) {
        try {
          const response = await fetch(GAS_WEB_APP_URL, {
            method: "POST",
            body: JSON.stringify({ action: "upload", fileName: file.name, fileContent: e.target.result })
          });

          const result = await response.json();
          btn.disabled = false;
          btn.innerHTML = `<i class="fas fa-upload"></i> <span>อัปโหลด (.html)</span>`;
          fileInput.value = '';
          Swal.close();

          if (result.success) {
            Swal.fire({ icon: 'success', title: 'อัปโหลดสำเร็จ!', confirmButtonColor: '#10b981' });
            loadGameList(false);
          } else {
            Swal.fire({ icon: 'error', title: 'อัปโหลดล้มเหลว', text: result.error });
          }
        } catch (err) {
          btn.disabled = false;
          btn.innerHTML = `<i class="fas fa-upload"></i> <span>อัปโหลด (.html)</span>`;
          Swal.close();
          Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: err.message });
        }
      };
      reader.readAsText(file);
    }
  </script>
</body>
</html>
