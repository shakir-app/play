<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Game Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- jQuery & DataTables -->
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <style>
    .dataTables_wrapper .dataTables_length select,
    .dataTables_wrapper .dataTables_filter input {
      border: 1px solid #d1d5db;
      border-radius: 0.375rem;
      padding: 0.25rem 0.5rem;
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body class="bg-gray-100 p-4 md:p-8 min-h-screen">
  <div class="max-w-5xl mx-auto bg-white p-6 md:p-8 rounded-xl shadow-md">
    <div class="flex items-center justify-between mb-6 pb-4 border-b">
      <h1 class="text-2xl font-bold text-gray-800 flex items-center gap-2">
        🎮 <span>AI Game Storage System</span>
      </h1>
    </div>

    <!-- Upload Form -->
    <div class="mb-6 p-4 md:p-6 border-2 border-dashed border-gray-300 rounded-xl bg-gray-50 flex flex-col md:flex-row items-center justify-between gap-4">
      <input type="file" id="fileInput" accept=".html" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer"/>
      <button onclick="uploadFile()" id="uploadBtn" class="w-full md:w-auto bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-lg font-medium whitespace-nowrap transition duration-200 shadow-sm">
        อัปโหลดไฟล์ .html
      </button>
    </div>

    <!-- Status Message -->
    <div id="status" class="hidden mb-4 p-3 rounded-lg text-sm font-medium"></div>

    <!-- Data Table -->
    <div class="mt-6 overflow-x-auto">
      <table id="gamesTable" class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-gray-100 text-gray-700">
            <th class="py-3 px-4 font-semibold">ชื่อไฟล์เกม (คลิกเพื่อเล่น)</th>
            <th class="py-3 px-4 font-semibold w-48">วันที่อัปโหลด</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    // URL ของ Google Apps Script Web App
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycby-TViIdx2ojOn6oDPISW1X00bGqfb0KtoKyJRzAYz_KusleirahN8SAWlOw75HUNC05w/exec";

    let tableInstance = null;

    $(document).ready(function() {
      loadGameList();
    });

    async function loadGameList() {
      showStatus("กำลังโหลดรายการเกม...", "bg-blue-50 text-blue-700 border border-blue-200");
      
      try {
        const response = await fetch(`${GAS_WEB_APP_URL}?action=getList`);
        const result = await response.json();

        if (result.success) {
          hideStatus();

          if (tableInstance) {
            tableInstance.destroy();
          }

          const tbody = $('#tableBody');
          tbody.empty();

          result.data.forEach(file => {
            tbody.append(`
              <tr class="hover:bg-gray-50 border-b">
                <td class="py-3 px-4">
                  <a href="${file.playUrl}" target="_blank" class="text-blue-600 font-semibold hover:text-blue-800 hover:underline flex items-center gap-2">
                    <span>🎮</span> <span>${file.name}</span>
                  </a>
                </td>
                <td class="py-3 px-4 text-gray-500">${file.date}</td>
              </tr>
            `);
          });

          tableInstance = $('#gamesTable').DataTable({
            language: {
              search: "ค้นหาเกม:",
              lengthMenu: "แสดง _MENU_ รายการ",
              info: "แสดง _START_ ถึง _END_ จากทั้งหมด _TOTAL_ รายการ",
              emptyTable: "ยังไม่มีไฟล์เกมในระบบ"
            }
          });
        } else {
          showStatus("ไม่สามารถดึงข้อมูลได้: " + (result.error || "เกิดข้อผิดพลาดไม่ทราบสาเหตุ"), "bg-red-50 text-red-700 border border-red-200");
        }
      } catch (err) {
        showStatus("เกิดข้อผิดพลาดในการดึงข้อมูล: " + err.message, "bg-red-50 text-red-700 border border-red-200");
      }
    }

    function uploadFile() {
      const fileInput = document.getElementById('fileInput');
      const file = fileInput.files[0];

      if (!file) {
        alert("กรุณาเลือกไฟล์ .html ก่อนครับ");
        return;
      }

      if (!file.name.endsWith('.html')) {
        alert("อัปโหลดได้เฉพาะไฟล์นามสกุล .html เท่านั้น");
        return;
      }

      const btn = document.getElementById('uploadBtn');
      btn.disabled = true;
      btn.innerText = "กำลังอัปโหลด...";
      showStatus("กำลังนำไฟล์ขึ้นระบบ...", "bg-yellow-50 text-yellow-700 border border-yellow-200");

      const reader = new FileReader();
      reader.onload = async function(e) {
        const fileContent = e.target.result;
        
        try {
          const response = await fetch(GAS_WEB_APP_URL, {
            method: "POST",
            body: JSON.stringify({
              action: "upload",
              fileName: file.name,
              fileContent: fileContent
            })
          });

          const result = await response.json();

          btn.disabled = false;
          btn.innerText = "อัปโหลดไฟล์ .html";
          fileInput.value = '';

          if (result.success) {
            showStatus("อัปโหลดสำเร็จแล้ว!", "bg-green-50 text-green-700 border border-green-200");
            loadGameList();
          } else {
            showStatus("เกิดข้อผิดพลาด: " + result.error, "bg-red-50 text-red-700 border border-red-200");
          }
        } catch (err) {
          btn.disabled = false;
          btn.innerText = "อัปโหลดไฟล์ .html";
          showStatus("เกิดข้อผิดพลาดในการอัปโหลด: " + err.message, "bg-red-50 text-red-700 border border-red-200");
        }
      };

      reader.readAsText(file);
    }

    function showStatus(text, bgClass) {
      const statusDiv = $('#status');
      statusDiv.attr('class', `mb-4 p-3 rounded-lg text-sm font-medium ${bgClass}`).text(text).show();
    }

    function hideStatus() {
      $('#status').hide();
    }
  </script>
</body>
</html>
